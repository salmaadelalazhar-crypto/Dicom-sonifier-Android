name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      BUILD_MODE: debug

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev \
            build-essential ccache
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Show buildozer version
        run: buildozer version

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Read package id
        id: pkg
        run: |
          NAME=$(grep '^package.name' buildozer.spec | cut -d= -f2 | xargs)
          DOMAIN=$(grep '^package.domain' buildozer.spec | cut -d= -f2 | xargs)
          echo "id=${DOMAIN}.${NAME}" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: yes | buildozer -v android debug

      - name: Locate built APK
        id: apk
        run: |
          APK=$(ls bin/*.apk 2>/dev/null | head -n1)
          echo "apk=${APK}" >> "$GITHUB_OUTPUT"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test (30 seconds on emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: python scripts/smoke_test.py "${{ steps.apk.outputs.apk }}" "${{ steps.pkg.outputs.id }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DICOMSonifier-android
          path: |
            bin/*.apk
            logcat.txt
